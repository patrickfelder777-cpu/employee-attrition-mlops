
name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download employee attrition dataset
        run: |
          mkdir -p data/raw
          curl --fail --location --retry 3 \
            --output /tmp/employee-attrition.zip \
            "https://www.kaggle.com/api/v1/datasets/download/pavansubhasht/ibm-hr-analytics-attrition-dataset"
          unzip -p /tmp/employee-attrition.zip \
            WA_Fn-UseC_-HR-Employee-Attrition.csv \
            > data/raw/employee_attrition.csv

      - name: Verify dataset checksum
        run: |
          echo "ad8207459e5732574372cf8ff619883f  data/raw/employee_attrition.csv" | md5sum --check

      - name: Train model
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python -m src.train --config configs/config.yaml

      - name: Run automated tests
        env:
          MLFLOW_TRACKING_URI: sqlite:///mlflow-ci.db
        run: |
          python -m pytest tests/ -v -p no:cacheprovider
